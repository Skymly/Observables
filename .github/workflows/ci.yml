name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile + Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run CI tests via Nuke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project build/_build.csproj -- --target Test --configuration Release 2>&1 | Tee-Object -FilePath test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  pack:
    name: Pack + Verify
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'pack')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack and verify via Nuke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project build/_build.csproj -- --target PackOnly --configuration Release 2>&1 | Tee-Object -FilePath pack.log

      - name: Upload pack log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-log
          path: pack.log
          if-no-files-found: warn

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/package/*.nupkg
          if-no-files-found: warn