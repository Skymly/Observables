name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-full:
    name: Full CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run full CI via Nuke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project build/_build.csproj -- --target Ci --configuration Release 2>&1 | Tee-Object -FilePath ci-${{ matrix.os }}.log

      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}
          path: ci-${{ matrix.os }}.log
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        shell: bash
        run: |
          version=1.7.12
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  format-whitespace:
    name: Format whitespace verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.300

      - name: Verify whitespace (LF / trailing)
        run: dotnet format whitespace Observables.slnx --verify-no-changes --verbosity diagnostic

  changes:
    name: Detect changed domains
    runs-on: windows-latest
    outputs:
      events: ${{ steps.filter.outputs.events }}
      restapi: ${{ steps.filter.outputs.restapi }}
      signalr: ${{ steps.filter.outputs.signalr }}
      mqtt: ${{ steps.filter.outputs.mqtt }}
      websocket: ${{ steps.filter.outputs.websocket }}
      grpc: ${{ steps.filter.outputs.grpc }}
      sse: ${{ steps.filter.outputs.sse }}
      nats: ${{ steps.filter.outputs.nats }}
      shared: ${{ steps.filter.outputs.shared }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files per domain
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: some
          filters: |
            events:
              - 'Observables.Events/**'
              - 'Observables.slnx'
            restapi:
              - 'Observables.RestAPI/**'
              - 'Observables.slnx'
            signalr:
              - 'Observables.SignalR/**'
              - 'Observables.slnx'
            mqtt:
              - 'Observables.Mqtt/**'
              - 'Observables.slnx'
            websocket:
              - 'Observables.WebSocket/**'
              - 'Observables.slnx'
            grpc:
              - 'Observables.Grpc/**'
              - 'Observables.slnx'
            sse:
              - 'Observables.Sse/**'
              - 'Observables.slnx'
            nats:
              - 'Observables.Nats/**'
              - 'Observables.slnx'
            shared:
              - 'Observables.Shared/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'eng/**'
              - 'eng/scripts/sync-doc-loc.ps1'
              - '**/loc/**'
              - 'build/**'
              - '.nuke/**'
              - '.github/workflows/**'
              - 'AGENTS.md'
              - 'README.md'
              - 'Observables.slnx'
              - 'global.json'
            any:
              - '**'

  test-shared:
    name: Test Shared (analyzers + codefixes)
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run Shared tests via Nuke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project build/_build.csproj -- --target Test --configuration Release --test-domains shared 2>&1 | Tee-Object -FilePath test-shared.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-shared
          path: test-shared.log
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shared
          path: TestResults/
          if-no-files-found: warn

  test-domain:
    name: Test ${{ matrix.domain }}
    needs: changes
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [events, restapi, signalr, mqtt, websocket, grpc, sse, nats]
    steps:
      - name: Skip if domain not changed and not shared
        if: |
          (needs.changes.outputs[matrix.domain] == 'true'
           || needs.changes.outputs.shared == 'true')
          && needs.changes.outputs[matrix.domain] != 'false'
        id: gate
        run: echo "Proceeding with ${{ matrix.domain }}"

      - name: Proceed only if gate passed
        if: steps.gate.outcome == 'success'
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run ${{ matrix.domain }} tests via Nuke
        if: steps.gate.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project build/_build.csproj -- --target Test --configuration Release --test-domains ${{ matrix.domain }} 2>&1 | Tee-Object -FilePath test-${{ matrix.domain }}.log

      - name: Upload test log
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.domain }}
          path: test-${{ matrix.domain }}.log
          if-no-files-found: warn

      - name: Upload test results
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.domain }}
          path: TestResults/
          if-no-files-found: warn

  pack-domain:
    name: Pack ${{ matrix.domain }}
    needs: changes
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [events, restapi, signalr, mqtt, websocket, grpc, sse, nats]
    steps:
      - name: Skip if domain not changed, push event skipped, or PR missing pack label
        if: |
          needs.changes.outputs[matrix.domain] == 'true'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pack')))
        id: gate
        run: echo "Proceeding with pack ${{ matrix.domain }}"

      - name: Proceed only if gate passed
        if: steps.gate.outcome == 'success'
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        if: steps.gate.outcome == 'success'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Cache NuGet packages
        if: steps.gate.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack and verify ${{ matrix.domain }} via Nuke
        if: steps.gate.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project build/_build.csproj -- --target PackOnly --configuration Release --pack-domains ${{ matrix.domain }} 2>&1 | Tee-Object -FilePath pack-${{ matrix.domain }}.log

      - name: Upload pack log
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pack-log-${{ matrix.domain }}
          path: pack-${{ matrix.domain }}.log
          if-no-files-found: warn

      - name: Upload packages
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ matrix.domain }}
          path: artifacts/package/*.nupkg
          if-no-files-found: warn

  smoke:
    name: NuGet consumer smoke (Local)
    needs: [changes, pack-domain]
    runs-on: windows-latest
    if: |
      needs.changes.outputs.any == 'true'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pack')))
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run NuGet consumer smoke via Nuke (Local, skip Test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project build/_build.csproj -- --target NuGetConsumerSmoke --configuration Release --consumer-feed Local --skip Test 2>&1 | Tee-Object -FilePath smoke.log

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          if-no-files-found: warn

  doc-loc:
    name: Doc localization parity
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Observables.slnx

      - name: Check localized XML doc parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/scripts/sync-doc-loc.ps1 -AllDomains 2>&1 | Tee-Object -FilePath doc-loc.log

      - name: Upload doc-loc log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-loc-log
          path: doc-loc.log
          if-no-files-found: warn
