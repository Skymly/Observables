# Pin GitHub Actions to commit SHAs (not floating tags).
# Upgrade: resolve the release commit on the action repo, replace the SHA, re-run CI.
name: Publish NuGet

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Authorize on actor OR triggering_actor so maintainer-driven agent tag
    # pushes (e.g. cursor[bot] with triggering_actor=Skymly) still publish.
    # Do not gate with job-level `if:` — a false condition skips silently
    # (0.1.8); fail the job instead so the miss is visible.
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Authorize publisher
        shell: bash
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          is_maintainer() {
            local who="$1"
            [[ "$who" == "Skymly" || "$who" == "wys0610" ]]
          }
          echo "actor=${GITHUB_ACTOR} triggering_actor=${TRIGGERING_ACTOR:-}"
          if is_maintainer "$GITHUB_ACTOR" || is_maintainer "${TRIGGERING_ACTOR:-}"; then
            echo "Authorized publisher."
            exit 0
          fi
          echo "::error::Publish refused: neither github.actor (${GITHUB_ACTOR}) nor github.triggering_actor (${TRIGGERING_ACTOR:-}) is a maintainer (Skymly|wys0610). Push the v* tag (or workflow_dispatch) as a maintainer, or have a maintainer re-run."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "Error: tag must start with 'v'. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "Error: VERSION is empty"
            exit 1
          fi

          # Validate tag version matches the PackageVersion Nuke publishes.
          PROPS_VERSION=$(grep -oP '<PackageVersion>\K[^<]+' eng/Observables.Package.props || true)
          if [[ -z "${PROPS_VERSION}" ]]; then
            echo "Error: PackageVersion not found in eng/Observables.Package.props"
            exit 1
          fi
          if [[ "${PROPS_VERSION}" != "${VERSION}" ]]; then
            echo "Error: tag version (${VERSION}) does not match eng/Observables.Package.props PackageVersion (${PROPS_VERSION})"
            exit 1
          fi

          echo "Publishing version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack, verify, and publish via Nuke
        shell: pwsh
        env:
          VERSION: ${{ env.VERSION }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project build/_build.csproj -- --target Publish --configuration Release 2>&1 | Tee-Object -FilePath publish.log

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nuget-publish-log
          path: publish.log
          if-no-files-found: warn

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nuget-packages
          path: artifacts/package/*.nupkg
          if-no-files-found: warn

      - name: Write publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NuGet Publish Summary"
            echo ""
            echo "- Version: \`${VERSION:-unknown}\`"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Triggering actor: \`${{ github.triggering_actor }}\`"
            echo "- Job status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Stable releases only: open version-bump PRs in the downstream repos.
  # Requires secrets.SYNC_TOKEN — a fine-grained PAT with Contents and
  # Pull requests access to Skymly/Observables.Docs and
  # Skymly/Observables.Samples. Job failure is visible but does not undo
  # the (already completed) publish.
  sync-docs:
    name: Open version-bump PR in Observables.Docs
    needs: publish
    if: needs.publish.result == 'success' && !contains(needs.publish.outputs.version, '-')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check sync token
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) {
              throw 'secrets.SYNC_TOKEN is not set. Create a fine-grained PAT with Contents + Pull requests access to Skymly/Observables.Docs and Skymly/Observables.Samples.'
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Skymly/Observables.Docs
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Bump referenced version
        shell: pwsh
        run: ./scripts/sync-observables-version.ps1 -Version $env:VERSION

      - name: Push branch and open PR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) {
              Write-Host "Already at $env:VERSION; no PR needed."
              exit 0
          }
          $branch = "chore/observables-version-$env:VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B $branch
          git add -A
          git commit -m "Bump Observables version to $env:VERSION"
          git push -f origin $branch

          $existing = gh pr list --repo Skymly/Observables.Docs --head $branch --state open --json number --jq '.[0].number'
          if ($existing) {
              Write-Host "PR #$existing already exists for $branch."
              exit 0
          }
          $body = @'
          Automated version sync after [Skymly/Observables](https://github.com/Skymly/Observables) published `__VERSION__` to nuget.org.

          - Rewrites the `%%OBS_VERSION%%` source (`.vitepress/observables-version.ts`) via `scripts/sync-observables-version.ps1`.
          - Merge once CI is green and the package is visible on nuget.org.

          Part of Observables R1-2. Release run: __RUN_URL__
          '@ -replace '__VERSION__', "v$env:VERSION" -replace '__RUN_URL__', $env:RUN_URL
          gh pr create --repo Skymly/Observables.Docs --base main --head $branch --title "Bump Observables version to $env:VERSION" --body $body

  sync-samples:
    name: Open version-bump PR in Observables.Samples
    needs: publish
    if: needs.publish.result == 'success' && !contains(needs.publish.outputs.version, '-')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check sync token
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) {
              throw 'secrets.SYNC_TOKEN is not set. Create a fine-grained PAT with Contents + Pull requests access to Skymly/Observables.Docs and Skymly/Observables.Samples.'
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Skymly/Observables.Samples
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Bump referenced version
        shell: pwsh
        run: ./scripts/sync-observables-version.ps1 -Version $env:VERSION

      - name: Push branch and open PR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) {
              Write-Host "Already at $env:VERSION; no PR needed."
              exit 0
          }
          $branch = "chore/observables-version-$env:VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B $branch
          git add -A
          git commit -m "Bump Observables version to $env:VERSION"
          git push -f origin $branch

          $existing = gh pr list --repo Skymly/Observables.Samples --head $branch --state open --json number --jq '.[0].number'
          if ($existing) {
              Write-Host "PR #$existing already exists for $branch."
              exit 0
          }
          $body = @'
          Automated version sync after [Skymly/Observables](https://github.com/Skymly/Observables) published `__VERSION__` to nuget.org.

          - Rewrites `Directory.Build.props`, README and `SampleMetadata.cs` literals via `scripts/sync-observables-version.ps1`.
          - Merge once CI is green and the packages are visible on nuget.org.

          Part of Observables R1-2. Release run: __RUN_URL__
          '@ -replace '__VERSION__', "v$env:VERSION" -replace '__RUN_URL__', $env:RUN_URL
          gh pr create --repo Skymly/Observables.Samples --base main --head $branch --title "Bump Observables version to $env:VERSION" --body $body
